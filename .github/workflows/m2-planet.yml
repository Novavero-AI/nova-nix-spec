name: M2-Planet

# Runs M2-Planet's own test suite at a ref of the fork on each architecture
# upstream's CI covers. Architectures a hosted runner cannot execute natively
# run under qemu-user, which is how upstream runs RISC-V. The self-host proof is
# printed because it can only be produced by running the self-built compiler,
# so a change to the compiler needs its hash from here.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of Novavero-AI/M2-Planet
        required: true

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, x86, aarch64, armv7l, riscv64, riscv32]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Novavero-AI/M2-Planet
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Install qemu-user
        if: matrix.arch != 'amd64' && matrix.arch != 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user qemu-user-binfmt

      - name: Install mescc-tools
        run: |
          git clone --recurse-submodules --depth=1 https://github.com/oriansj/mescc-tools "$RUNNER_TEMP/mescc-tools"
          make -C "$RUNNER_TEMP/mescc-tools" install -j"$(nproc)"

      - name: Build
        run: make

      - name: Test
        env:
          GET_MACHINE_FLAGS: --override ${{ matrix.arch }}
        run: make test

      - name: Self-host proof
        if: always()
        run: |
          if [ -f test/test1000/proof ]; then
            sha256sum test/test1000/proof
          else
            echo "no proof was produced"
          fi

  # cc_x86 compiles M2-Planet in every stage0 bootstrap, so a change gcc accepts
  # can still break the chain. This builds the fork's M2-Planet the way the
  # Windows ladder does, starting from the seed.
  bootstrap:
    name: built by cc_x86 from the seed
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The runner's Git rewrites line endings on checkout, and the chain has
      # to read the bytes that were committed.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          repository: Novavero-AI/stage0-pe32
          ref: 6e5acc5c37ecfa1cde1ced7bce07ae8904f6958a
          path: stage0-pe32
          submodules: recursive

      - name: Take M2-Planet out of the ladder
        shell: bash
        run: rm -rf stage0-pe32/M2-Planet

      - uses: actions/checkout@v7
        with:
          repository: Novavero-AI/M2-Planet
          ref: ${{ inputs.ref }}
          path: stage0-pe32/M2-Planet

      - name: Build the chain from the seed
        shell: cmd
        run: stage0-pe32\x86\mescc-tools-mini.cmd
