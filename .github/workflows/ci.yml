name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGE0_PE32_REF: d27eb1753a5a83cf2aa5d45fe0b341e3924e4f6b
  BOOTSTRAP_SEEDS_REF: cedec6b8066d1db229b6c77d42d120a23c6980ed
  METAMATH_TEST_REF: 5758bf781bab662d4b31c7f72ac4dedea74fcb0f
  SET_MM_REF: 1c6aea1d3bd49e470ef229eee2632944b98af3b9
  SET_MM_SHA256: 7a63aada1c14dbef0f683db6bd59ee62d582b61ef2ee013d224f04f38c734d33
  MUTANT_DIVISOR: 3

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Seed.lean's theorems are about the pinned upstream files, which
      # seed_bytes.py writes into Seed/Bytes.lean before the build.
      - uses: actions/checkout@v7
        with:
          repository: oriansj/bootstrap-seeds
          ref: ${{ env.BOOTSTRAP_SEEDS_REF }}
          path: bootstrap-seeds

      - uses: actions/checkout@v7
        with:
          repository: Novavero-AI/stage0-pe32
          ref: ${{ env.STAGE0_PE32_REF }}
          path: stage0-pe32

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Seed bytes from the pinned files
        run: python -I scripts/seed_bytes.py bootstrap-seeds stage0-pe32

      - uses: leanprover/lean-action@v1

      - name: No proof rests on sorry
        run: |
          for file in NixLayer.lean Trust.lean Metamath.lean Hex0.lean Seed.lean; do
            if lake env lean "$file" | grep sorryAx; then
              exit 1
            fi
          done

  # Each real hex0 seed and Hex0.decode, run on the same inputs. The upstream
  # Linux seed's range check is cmp al,7 where 6 would bound A to F, so it also
  # takes G and g as a digit worth 16, and decode does not.
  seeds:
    name: hex0 seed against Hex0.decode on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            seed: bootstrap-seeds/POSIX/x86/hex0-seed
            decode: .lake/build/bin/decode
            known: G before a digit,g before a digit,G after a digit
          - os: windows-latest
            seed: stage0-pe32/bootstrap-seeds/PE32/i386/hex0-seed.exe
            decode: .lake/build/bin/decode.exe
            known: none
          - os: windows-11-arm
            seed: stage0-pe32/bootstrap-seeds/PE32/i386/hex0-seed.exe
            decode: .lake/build/bin/decode.exe
            known: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # The runner's Git rewrites line endings on checkout, and the seeds have
      # to be the bytes that were committed.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: oriansj/bootstrap-seeds
          ref: ${{ env.BOOTSTRAP_SEEDS_REF }}
          path: bootstrap-seeds

      - uses: actions/checkout@v7
        with:
          repository: Novavero-AI/stage0-pe32
          ref: ${{ env.STAGE0_PE32_REF }}
          path: stage0-pe32

      # Only decode: Seed.lean needs the generated bytes, and the lean job
      # proves it.
      - uses: leanprover/lean-action@v1
        with:
          build-args: decode

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Seed and decode agree
        run: python -I scripts/seed_behaviour.py "${{ matrix.seed }}" "${{ matrix.decode }}" "${{ matrix.known }}"

  # The checker's own build on each operating system nova-nix ships for. The
  # Windows job keeps Git's CRLF checkout, so the databases there carry CRLF.
  host:
    name: Checker under ${{ matrix.cc }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            exe: mmcheck
          - os: macos-latest
            cc: clang
            exe: mmcheck
          # MSVC's C library marks fopen deprecated in favour of fopen_s, which
          # is C11's optional Annex K and absent from glibc and M2libc. This is
          # Microsoft's documented switch for ISO C code.
          - os: windows-latest
            cc: clang
            exe: mmcheck.exe
            cflags: -D_CRT_SECURE_NO_WARNINGS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: david-a-wheeler/metamath-test
          ref: ${{ env.METAMATH_TEST_REF }}
          path: metamath-test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build with warnings as errors
        run: |
          mkdir build
          ${{ matrix.cc }} -std=c99 -O2 -Wall -Wextra -Wpedantic -Wstrict-prototypes -Wshadow -Werror \
            ${{ matrix.cflags }} -o build/${{ matrix.exe }} checker/mmcheck.c

      - name: Suite
        run: checker/run-suite.sh build/${{ matrix.exe }} metamath-test

      - name: Rule cases
        run: python -I checker/tests/compare_rules.py build/${{ matrix.exe }}

      - name: Build under sanitizers
        if: runner.os != 'Windows'
        run: |
          ${{ matrix.cc }} -std=c99 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -o build/mmcheck-san checker/mmcheck.c

      - name: Suite under sanitizers
        if: runner.os != 'Windows'
        run: checker/run-suite.sh build/mmcheck-san metamath-test

      - name: A test notices each check being removed
        if: runner.os != 'Windows'
        run: python -I checker/tests/kill_checks.py metamath-test "$RUNNER_TEMP/variants"

  linux:
    name: Checker built by M2-Planet on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Novavero-AI/stage0-pe32
          ref: ${{ env.STAGE0_PE32_REF }}
          path: stage0-pe32
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: david-a-wheeler/metamath-test
          ref: ${{ env.METAMATH_TEST_REF }}
          path: metamath-test

      # The M2-Planet makefile lists headers among the inputs of a rule using
      # -o, so its sources are compiled directly.
      - name: Build the toolchain
        run: |
          make -C stage0-pe32/mescc-tools
          cd stage0-pe32/M2-Planet
          mkdir -p bin
          gcc -D_GNU_SOURCE -O2 -std=c99 -w -o bin/M2-Planet \
            M2libc/bootstrappable.c cc_reader.c cc_strings.c cc_types.c cc_emit.c \
            cc_core.c cc_macro.c cc.c cc_globals.c

      - name: Build the checker
        run: |
          mkdir build
          checker/build-linux.sh stage0-pe32 build/mmcheck-x86
          sha256sum build/mmcheck-x86

      - name: Suite
        run: checker/run-suite.sh build/mmcheck-x86 metamath-test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Rule cases
        run: python -I checker/tests/compare_rules.py build/mmcheck-x86

      - name: Corrupted databases
        run: python -I checker/tests/compare_mutants.py 1 build/mmcheck-x86 metamath-test "$MUTANT_DIVISOR"

      - name: Fetch a current set.mm
        run: |
          curl -sSfL --retry 3 -o set-current.mm \
            "https://raw.githubusercontent.com/metamath/set.mm/$SET_MM_REF/set.mm"
          echo "$SET_MM_SHA256  set-current.mm" | sha256sum -c -

      - name: Check a current set.mm
        run: time build/mmcheck-x86 set-current.mm

  # The chain and the checker are 32-bit x86 on both runners: x64 Windows runs
  # them on the CPU through WOW64, and ARM64 Windows through its x86 emulator.
  windows:
    name: Checker built from the seed on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # The runner's Git rewrites line endings on checkout, and the chain has
      # to read the bytes that were committed.
      - name: Keep committed line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Novavero-AI/stage0-pe32
          ref: ${{ env.STAGE0_PE32_REF }}
          path: stage0-pe32
          submodules: recursive

      - uses: actions/checkout@v7
        with:
          repository: david-a-wheeler/metamath-test
          ref: ${{ env.METAMATH_TEST_REF }}
          path: metamath-test

      - name: Build the chain from the seed
        shell: cmd
        run: stage0-pe32\x86\mescc-tools-mini.cmd

      - name: hex0 reproduces the seed
        shell: pwsh
        run: |
          $seed = (Get-FileHash stage0-pe32/bootstrap-seeds/PE32/i386/hex0-seed.exe).Hash
          $hex0 = (Get-FileHash stage0-pe32/x86/artifact/hex0.exe).Hash
          if ($seed -ne $hex0) { throw "hex0.exe is not the seed: $hex0, expected $seed" }

      - name: Build the checker with the chain
        shell: cmd
        run: checker\build-windows.cmd stage0-pe32 build

      - name: Hash the checker
        shell: pwsh
        run: Get-FileHash build/mmcheck.exe

      - name: Suite
        shell: bash
        run: checker/run-suite.sh build/mmcheck.exe metamath-test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Rule cases
        shell: pwsh
        run: python -I checker/tests/compare_rules.py build/mmcheck.exe

      - name: Corrupted databases
        shell: pwsh
        run: python -I checker/tests/compare_mutants.py 1 build/mmcheck.exe metamath-test $env:MUTANT_DIVISOR

      - name: Fetch a current set.mm
        shell: bash
        run: |
          curl -sSfL --retry 3 -o set-current.mm \
            "https://raw.githubusercontent.com/metamath/set.mm/$SET_MM_REF/set.mm"
          echo "$SET_MM_SHA256  set-current.mm" | sha256sum -c -

      - name: Check a current set.mm
        shell: pwsh
        run: |
          Measure-Command { build\mmcheck.exe set-current.mm | Out-Host }
          if ($LASTEXITCODE -ne 0) { throw "set.mm refused" }
